<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小价 · 比价助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#f5f6fa; --mine:#4f7cff; --card:#fff; --text:#1c2333; --muted:#8b93a8; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    display:flex; flex-direction:column; background:var(--bg); color:var(--text);
    font:15px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header {
    position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid #e6e9f2;
    padding:10px 14px; display:flex; align-items:center; gap:10px;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  header .avatar { width:34px; height:34px; border-radius:8px; background:var(--mine);
    display:flex; align-items:center; justify-content:center; font-size:18px; }
  header .title { font-weight:600; font-size:16px; }
  header .loc { font-size:12px; color:var(--muted); max-width:52vw; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  #btn-loc {
    margin-left:auto; border:1px solid #dbe1f0; background:#f0f3fb; color:var(--text);
    border-radius:99px; padding:6px 12px; font-size:13px; cursor:pointer;
  }
  #messages { flex:1; overflow-y:auto; padding:16px 12px 8px; }
  .msg { max-width:82%; margin-bottom:12px; padding:10px 12px; border-radius:12px;
    white-space:pre-wrap; word-break:break-word; font-size:15px; line-height:1.55; }
  .msg.bot { background:var(--card); border:1px solid #e6e9f2; border-top-left-radius:4px; }
  .msg.me { background:var(--mine); color:#fff; margin-left:auto; border-top-right-radius:4px; }
  .msg.waiting { color:var(--muted); font-style:italic; }
  footer { position:sticky; bottom:0; background:var(--card); border-top:1px solid #e6e9f2;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; }
  #input { flex:1; border:1px solid #dbe1f0; border-radius:10px; padding:10px 12px;
    font-size:15px; outline:none; background:#fbfcff; }
  #btn-send { background:var(--mine); color:#fff; border:none; border-radius:10px;
    padding:0 18px; font-size:15px; cursor:pointer; }
  #btn-send:disabled { opacity:.5; }
  #overlay {
    position:fixed; inset:0; background:rgba(28,35,51,.55); z-index:9;
    display:flex; align-items:center; justify-content:center;
  }
  #overlay .box { background:var(--card); border-radius:14px; padding:22px; width:min(86vw,320px); }
  #overlay h3 { margin-bottom:6px; }
  #overlay p { color:var(--muted); font-size:13px; margin-bottom:14px; }
  #overlay input { width:100%; margin-bottom:10px; border:1px solid #dbe1f0;
    border-radius:10px; padding:10px 12px; font-size:15px; outline:none; }
  #overlay button { width:100%; background:var(--mine); color:#fff; border:none;
    border-radius:10px; padding:11px; font-size:15px; cursor:pointer; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<header>
  <div class="avatar">💰</div>
  <div>
    <div class="title">小价 · 比价助手</div>
    <div class="loc" id="loc-display">未定位</div>
  </div>
  <button id="btn-loc" onclick="locate()">🧭 定位</button>
</header>

<div id="messages"></div>

<footer>
  <input id="input" placeholder="想看什么电影 / 买什么？" onkeydown="if(event.key==='Enter')send()">
  <button id="btn-send" onclick="send()">发送</button>
</footer>

<div id="overlay" class="hidden">
  <div class="box">
    <h3>登录</h3>
    <p>与管理后台使用同一账号密码</p>
    <input id="login-user" placeholder="账号" autocomplete="username">
    <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
    <button onclick="doLogin()">进入</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const uid = localStorage.getItem("web_uid") || (() => {
  const v = (crypto.randomUUID ? crypto.randomUUID() : "u" + Date.now() + Math.random()).replace(/[^wx-]/g, "");
  localStorage.setItem("web_uid", v);
  return v;
})();

function bubble(text, mine, waiting) {
  const el = document.createElement("div");
  el.className = "msg " + (mine ? "me" : "bot") + (waiting ? " waiting" : "");
  el.textContent = text;
  $("messages").appendChild(el);
  $("messages").scrollTop = $("messages").scrollHeight;
  return el;
}

async function api(path, body) {
  const resp = await fetch("/chat/api/" + path + (body === undefined ? "?uid=" + uid : ""), {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (resp.status === 401) { showLogin(); throw new Error("未登录"); }
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.detail || resp.statusText);
  return data;
}

function showLogin() { $("overlay").classList.remove("hidden"); }

async function doLogin() {
  try {
    const resp = await fetch("/chat/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("login-user").value.trim(), password: $("login-pass").value }),
    });
    if (resp.ok) { $("overlay").classList.add("hidden"); boot(); }
    else bubble("登录失败：账号或密码错误（与管理后台 2048 端口同一账号）", false);
  } catch (e) { bubble("登录请求失败：" + e.message, false); }
}

async function boot() {
  bubble("你好，我是小价～ 说「我想看流浪地球3，哪家优惠最大」试试。先点右上角「🧭 定位」让我知道你在哪，就能问「附近」的问题了。", false);
  try {
    const state = await api("state");
    if (state.location && state.location.address) $("loc-display").textContent = state.location.address;
  } catch (e) {}
}

async function send() {
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  bubble(text, true);
  const wait = bubble("小价思考中…", false, true);
  $("btn-send").disabled = true;
  try {
    const data = await api("message", { uid, text });
    wait.remove();
    bubble(data.reply, false);
  } catch (e) {
    wait.remove();
    bubble("出错了：" + e.message, false);
  } finally { $("btn-send").disabled = false; }
}

function locate() {
  if (!navigator.geolocation) return bubble("此浏览器不支持定位", false);
  if (!window.isSecureContext) return bubble("浏览器仅在 HTTPS 页面允许 GPS 定位。请用域名+HTTPS 访问，或在管理后台手动填地址。", false);
  $("btn-loc").textContent = "定位中…";
  navigator.geolocation.getCurrentPosition(
    async pos => {
      try {
        const data = await api("location", {
          uid, lat: pos.coords.latitude, lng: pos.coords.longitude,
        });
        $("loc-display").textContent = data.address || `已定位（精度约${Math.round(pos.coords.accuracy)}米）`;
        bubble(data.resolved
          ? `📍 已精确定位：${data.address}（精度约${Math.round(pos.coords.accuracy)}米）。现在可以问「附近哪家影院优惠最大」了。`
          : "📍 坐标已保存，但未配置高德Key无法解析成地址；已可查附近（管理后台配置高德Key后体验更佳）。", false);
      } catch (e) { bubble("保存定位失败：" + e.message, false); }
      finally { $("btn-loc").textContent = "🧭 定位"; }
    },
    err => {
      $("btn-loc").textContent = "🧭 定位";
      bubble("定位失败：" + err.message, false);
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
  );
}

boot();
</script>
</body>
</html>
