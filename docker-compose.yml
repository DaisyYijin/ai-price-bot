# AI 比价机器人助手 —— Docker Compose 部署
#
# 启动:   docker compose up -d --build
# 配置:   打开 http://服务器IP:18600/admin 网页后台填写各平台密钥（落盘 ./data，重建容器不丢）
#         或不用面板，直接把配置写进 data/config.env 再 docker compose restart
# 终端体验: docker compose run --rm price-bot python -m app.cli

services:
  price-bot:
    build: .
    image: ai-price-bot:latest        # 构建镜像命名，便于复用/导出/离线迁移
    container_name: price-bot
    restart: unless-stopped           # 崩溃或宿主机重启后自动拉起；管理后台「立即重启」也依赖它
    init: true                        # 正确处理信号与子进程回收
    stop_grace_period: 15s            # 退出前给钉钉线程/QQ长连接留收尾时间
    ports:
      - "18600:8000"                  # 宿主机用不常用端口18600，容器内仍是8000；钉钉/QQ 仅出站连接
      # 服务器有反向代理时建议只绑本机: "127.0.0.1:18600:8000"
    volumes:
      # ./data 是应用唯一需要持久化的目录，包含全部状态:
      #   config.env       网页后台写入的配置（各平台密钥、开关、价格源）
      #   admin_password   管理后台密码哈希（PBKDF2）
      #   session.key      管理后台会话签名密钥
      #   logs/app.log     应用日志（按天轮转，保留 14 天）
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai               # 日志时间戳使用本地时区
      # 环境变量直配也可（优先级高于 data/config.env），适合 CI/脚本注入:
      # LLM_API_KEY: sk-xxx
      # DINGTALK_ENABLED: "true"
      # DINGTALK_CLIENT_ID: xxx
      # DINGTALK_CLIENT_SECRET: xxx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file               # 容器 stdout 日志轮转（访问日志在这里）
      options:
        max-size: "10m"
        max-file: "3"
    # 资源上限（按机器情况取消注释）
    # mem_limit: 512m
    # cpus: "1.0"
