# 改好 ADMIN_USERNAME / ADMIN_PASSWORD 后: docker compose up -d --build
# 前台/网页聊天: http://服务器IP:2222    管理后台: http://服务器IP:2048/admin

services:
  price-bot:
    image: ghcr.io/daisyyijin/ai-price-bot:latest
    restart: unless-stopped
    ports:
      - "2048:2048"   # 管理后台 + 企业微信回调
      - "2222:2222"   # 前台首页 + 网页聊天
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: Asia/Shanghai
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me
    # 想从源码构建: 注释掉上面的 image，取消下行注释，docker compose up -d --build
    # build: .
    # ghcr.io 国内拉取超时(TLS handshake timeout)时，换用镜像加速源（已验证同步全部版本）:
    #   image: ghcr.nju.edu.cn/daisyyijin/ai-price-bot:latest
    #   image: ghcr.dockerproxy.net/daisyyijin/ai-price-bot:latest
