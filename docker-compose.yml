# 改好 ADMIN_USERNAME / ADMIN_PASSWORD 后: docker compose up -d --build
# 网页后台: http://服务器IP:2048/admin

services:
  price-bot:
    build: .
    restart: unless-stopped
    ports:
      - "2048:2048"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: Asia/Shanghai
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me
