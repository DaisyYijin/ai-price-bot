services:
  price-bot:
    build: .
    container_name: price-bot
    restart: unless-stopped   # 管理后台的「重启」依赖此策略自动拉起
    ports:
      - "8000:8000"   # 网页管理后台 + 企业微信回调；钉钉/QQ 仅出站连接
    volumes:
      - ./data:/app/data   # 管理后台写入的配置/密码，落宿主机持久化
    # 说明：各平台密钥推荐在 http://服务器:8000/admin 网页后台填写；
    # 也可不用面板，直接把配置写进 data/config.env 再 up。
